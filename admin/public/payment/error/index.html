<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Bag'up — Paiement non finalisé</title>
  <style>
    :root {
      --primary: #0D8F8F;
      --accent: #F04A3A;
      --secondary: #F7E300;
      --gray-900: #111827;
      --gray-600: #4B5563;
      --gray-50: #F8FAFB;
      --white: #FFFFFF;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      background:
        radial-gradient(ellipse 80% 50% at 20% 0%, rgba(240, 74, 58, 0.12), transparent 55%),
        radial-gradient(ellipse 60% 40% at 100% 100%, rgba(13, 143, 143, 0.12), transparent 50%),
        var(--gray-50);
      color: var(--gray-900);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px 16px;
    }
    .card {
      width: 100%;
      max-width: 420px;
      background: var(--white);
      border-radius: 16px;
      padding: 36px 28px;
      text-align: center;
      border: 1px solid #E5E7EB;
      box-shadow: 0 12px 40px rgba(17, 24, 39, 0.06);
    }
    .brand {
      font-size: 28px;
      font-weight: 800;
      letter-spacing: -0.5px;
      color: var(--primary);
      margin-bottom: 20px;
    }
    .icon {
      width: 64px;
      height: 64px;
      margin: 0 auto 18px;
      border-radius: 50%;
      background: var(--accent);
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .icon svg { width: 32px; height: 32px; }
    h1 {
      margin: 0 0 10px;
      font-size: 22px;
      font-weight: 700;
    }
    p {
      margin: 0 0 8px;
      color: var(--gray-600);
      font-size: 15px;
      line-height: 1.5;
    }
    .hint {
      margin-top: 20px;
      padding-top: 16px;
      border-top: 1px solid #E5E7EB;
      font-size: 13px;
      color: var(--gray-600);
    }
    .bar {
      height: 4px;
      background: var(--secondary);
      border-radius: 2px;
      margin: 0 0 24px;
    }
  </style>
</head>
<body>
  <main class="card">
    <div class="brand">Bag'up</div>
    <div class="bar"></div>
    <div class="icon" aria-hidden="true">
      <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M18 6L6 18M6 6l12 12" />
      </svg>
    </div>
    <h1>Paiement non finalisé</h1>
    <p>Le paiement a été annulé ou n'a pas abouti.</p>
    <p>Retournez dans l'application Bag'up pour réessayer.</p>
    <p class="hint">Vous pouvez fermer cette page.</p>
  </main>
</body>
</html>
